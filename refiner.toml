# Oppsett av raffineringsagenten. Ingenting her er hemmelig, så det kan committes.
# Den eneste hemmeligheten, Notion API-nøkkelen, ligger i .env.

[agent]
# Modell og innsats for økta. Sonnet holder til raffinering og koster mye mindre enn Opus.
# Bytt til "claude-opus-5-5" eller effort = "high" hvis spesifikasjonene blir for tynne.
model = "claude-sonnet-5-5"
effort = "medium"
# Modell for utviklingsøktene (fra Klar til PR). Står den tom, brukes model over.
dev_model = "claude-sonnet-5-5"
# Hvor mange agenter som kan jobbe samtidig, på hver sin oppgave. Høyere går fortere, men koster
# mer per minutt og gir flere samtidige kall mot Notion (som har en grense på ca. 3 kall i sekundet).
parallel = 10
# Gjennomgangen før main er det siste som stopper feil, så den får høyere innsats.
review_model = "claude-sonnet-5-5"
review_effort = "high"
# Etter så mange oppgaver i main rydder en agent i notatene i docs/agents (slår sammen, fjerner utdaterte).
tidy_every = 5
# Hvor mange runder gjennomgangen kan be om endringer før oppgaven går til eieren.
review_rounds = 2
# Nettilgang (WebSearch og WebFetch) for agentene, til dokumentasjon, API-er og pakker. false skrur det av.
web = true

[notion]
# Notion-siden som har oppgaveboardet
board = "https://app.notion.com/p/4006bd3085418018ae5ad454d93b7159"

[code]
# Produktets kode. /sync-code holder en skrivebeskyttet kopi av repoet oppdatert i
# .cache/code med din egen git-innlogging, så det trengs ingen GitHub-nøkkel eller MCP-server.
github = "https://github.com/magnusgiverin/agentic-development-test"
branch = "main"
# Eller les en lokal mappe i stedet (kommenter ut github over):
# local = "../hellas-grill"

[design]
# Produktets hovedfil eller -side i Figma. Lenker i oppgavene går først. Har en oppgave
# ingen lenke, blar agenten i denne fila etter frames som passer. Leses via claude.ai-
# koblingen til Figma.
figma = "https://www.figma.com/design/LC06usO0N9ckIfvwk3V7xc/Agentic-Figma-test"
# Ved visuelle endringer tegner agenten en skisse på siden «🤖 Skisser» i fila over, og eieren må
# godkjenne den før oppgaven blir Klar. Krever at Figma-kontoen din kan redigere fila.
sketches = true

[slack]
# Kanal-ID-en (for eksempel "C0123ABC") til den ene kanalen Slack-broen bruker. /new virker bare
# der, og alle oppgaver får sin tråd der, også de som lages direkte i Notion. Påkrevd for Slack.
# Finn ID-en nederst i kanalens detaljer i Slack, og inviter boten: /invite @Raffineringsagent
# Bare for testing: alle oppgaver fra /new får denne Notion-brukeren som Eier, uansett hvem
# som skriver kommandoen. Tøm den (test_owner = "") for å finne eieren ut fra e-post i stedet.
test_owner = "3acd872b-594c-8185-9655-0002880a6432"  # magnus.giverin@bekk.no
channel = "C0CBAJUQFGR"
