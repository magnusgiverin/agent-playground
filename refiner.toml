# Hvordan agentene oppfører seg. Dette er likt for alle som kjører agenten, og kan committes.
# Hva en instans er koblet til (Notion-board, GitHub-repo, Figma-fil, Slack-kanal) og hemmelighetene
# er miljøvariabler i .env (se .env.example og README).

[agent]
# Modell og innsats for økta. Sonnet holder til raffinering og koster mye mindre enn Opus.
# Bytt til "claude-opus-5-5" eller effort = "high" hvis spesifikasjonene blir for tynne.
model = "claude-sonnet-5-5"
effort = "medium"
# Modell for utviklingsøktene (fra Klar til PR). Står den tom, brukes model over.
dev_model = "claude-sonnet-5-5"
# Hvor mange agenter som kan jobbe samtidig, på hver sin oppgave. Høyere går fortere, men koster
# mer per minutt og gir flere samtidige kall mot Notion (som har en grense på ca. 3 kall i sekundet).
parallel = 10
# Gjennomgangen før main er det siste som stopper feil, så den får høyere innsats.
review_model = "claude-sonnet-5-5"
review_effort = "high"
# Etter så mange oppgaver i main rydder en agent i notatene i docs/agents (slår sammen, fjerner utdaterte).
tidy_every = 5
# Hvor mange runder gjennomgangen kan be om endringer før oppgaven går til eieren.
review_rounds = 2
# Nettilgang (WebSearch og WebFetch) for agentene, til dokumentasjon, API-er og pakker. false skrur det av.
web = true

# Flere instanser (PC-er) på samme board: hver jobb tar en lås i Notion-egenskapen «Agent».
# Låsen fornyes mens agenten jobber, og utløper etter så mange minutter hvis instansen forsvinner.
lease_minutes = 10
# Hvor lenge instansen som har en hvilende oppgave (og økta), får på seg til å svare på nytt fra eieren,
# før en annen instans tar over.
takeover_minutes = 5

[design]
# Ved visuelle endringer tegner agenten en skisse på siden «🤖 Skisser» i Figma-fila (FIGMA_FILE), og eieren
# må godkjenne den før oppgaven blir Klar. Krever at Figma-kontoen din kan redigere fila.
sketches = true
