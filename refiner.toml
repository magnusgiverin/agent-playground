# Oppsett av raffineringsagenten. Ingenting her er hemmelig, så det kan committes.
# Den eneste hemmeligheten, Notion API-nøkkelen, ligger i .env.

[agent]
# Modell og innsats for økta. Sonnet holder til raffinering og koster mye mindre enn Opus.
# Bytt til "claude-opus-5-5" eller effort = "high" hvis spesifikasjonene blir for tynne.
model = "claude-sonnet-5-5"
effort = "medium"
# Modell for utviklingsøktene (fra Klar til PR). Står den tom, brukes model over.
dev_model = "claude-sonnet-5-5"
# Hvor mange agenter som kan jobbe samtidig, på hver sin oppgave. Høyere går fortere, men koster
# mer per minutt og gir flere samtidige kall mot Notion (som har en grense på ca. 3 kall i sekundet).
parallel = 10
# Gjennomgangen før main er det siste som stopper feil, så den får høyere innsats.
review_model = "claude-sonnet-5-5"
review_effort = "high"
# Etter så mange oppgaver i main rydder en agent i notatene i docs/agents (slår sammen, fjerner utdaterte).
tidy_every = 5
# Hvor mange runder gjennomgangen kan be om endringer før oppgaven går til eieren.
review_rounds = 2
# Nettilgang (WebSearch og WebFetch) for agentene, til dokumentasjon, API-er og pakker. false skrur det av.
web = true

[notion]
# Notion-siden som har oppgaveboardet
board = "https://app.notion.com/p/4026bd3085418010bf58dd82711fbfd3"

[code]
# Produktets kode. /sync-code holder en skrivebeskyttet kopi av repoet oppdatert i
# .cache/code med din egen git-innlogging, så det trengs ingen GitHub-nøkkel eller MCP-server.
github = "https://github.com/aiman01nad/agentic-parkering-test"
branch = "main"
# Eller les en lokal mappe i stedet (kommenter ut github over):
# local = "../hellas-grill"

[design]
# Produktets hovedfil eller -side i Figma. Lenker i oppgavene går først. Har en oppgave
# ingen lenke, blar agenten i denne fila etter frames som passer. Leses via claude.ai-
# koblingen til Figma.
figma = "https://www.figma.com/design/ykSPX12OvIghV4Sbg4OHTX/10-Parkering-%E2%80%93-Design--Copy-?node-id=1-4&m=dev"
# Ved visuelle endringer tegner agenten en skisse på siden «🤖 Skisser» i fila over, og eieren må
# godkjenne den før oppgaven blir Klar. Krever at Figma-kontoen din kan redigere fila.
sketches = true

[merge]
# Hva som skjer når utviklingen er ferdig. «pr»: branchen pushes, en PR åpnes (status Til gjennomgang), og den
# merges først når den er godkjent. «main»: branchen føres rett inn i main uten review. «pr» krever gh (GitHub CLI)
# innlogget med skrivetilgang til repoet.
mode = "pr"
# squash (én commit per oppgave, anbefalt), rebase eller merge. Branchen er alltid rebaset på main først.
method = "squash"
# Hva som teller som godkjent: «review» (en annen person godkjenner i GitHub, forfatteren kan ikke godkjenne sin egen PR),
# «label» (PR-en merkes med etiketten under, snarveien) eller «review+label» (begge).
approval = "review+label"
label = "godkjent"
# AI-review før PR-en åpnes: en fersk økt (uten dev-agentens historikk) sjekker diffen mot kontrakten i oppgaven.
# Alvorlige og middels funn sendes tilbake til dev-agenten, opptil review_rounds ganger. Deretter åpnes PR-en
# uansett, med funnene som gjenstår i beskrivelsen. Tom review_model betyr samme modell som dev_model.
ai_review = true
review_rounds = 2
review_model = ""
# Auto-løpet: en PR som klassifiseres som «auto» merges uten menneske når CI er grønn og AI-reviewen var ren.
# Av som standard. Krever at repoet har CI-sjekker (uten dem faller PR-en tilbake til manuelt løp) og ai_review = true.
auto_lane = false

# Hva som skal til for at en PR kan være «auto». Alt annet blir «manual» og må godkjennes av et menneske.
[merge.classify]
max_lines = 150          # endrede linjer (lagt til + fjernet)
max_files = 8
sensitive = [".github/*", "package.json", "package-lock.json", "pnpm-lock.yaml", "yarn.lock", ".env*", "Dockerfile*", "*/auth/*", "*/migrations/*"]
manual_sizes = ["L", "XL"]                       # oppgavestørrelser som alltid er manuelle
manual_tags = ["security", "infrastructure"]     # etiketter på oppgaven som alltid er manuelle

[slack]
# Kanal-ID-en (for eksempel "C0123ABC") til den ene kanalen Slack-broen bruker. /new virker bare
# der, og alle oppgaver får sin tråd der, også de som lages direkte i Notion. Påkrevd for Slack.
# Finn ID-en nederst i kanalens detaljer i Slack, og inviter boten: /invite @Raffineringsagent
# Bare for testing: alle oppgaver fra /new får denne Notion-brukeren som Eier, uansett hvem
# som skriver kommandoen. Tøm den (test_owner = "") for å finne eieren ut fra e-post i stedet.
test_owner = "3acd872b-594c-81bf-85f2-000238b09feb"  # aiman.nadeem@bekk.no
channel = "C0CBAJUQFGR"
